[build-system]
requires = ["setuptools>=80", "wheel", "setuptools-scm[simple]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ivory"
dynamic = ["version"]
description = "Ivory: Simple and flexible workflow engine"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Piyanat Kittiwisit", email = "piyanat.kittiwisit@gmail.com" },
    { name = "Amadeus Wild", email = "amadeus.wild@manchester.ac.uk" },
    { name = "Joel Akeret" },
    { name = "Lukas Gamper", email = "gamperl@gmail.com" },
]
keywords = ["workflow", "pipeline", "plugin", "radio-astronomy", "meerklass"]
dependencies = [
    "numpy>=2.0.0",
    "joblib>=1.3",
    "psutil>=5.9.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/meerklass/ivory"
Repository = "https://github.com/meerklass/ivory"
Changelog = "https://github.com/meerklass/ivory/blob/main/CHANGELOG.md"
Issues = "https://github.com/meerklass/ivory/issues"

[project.scripts]
ivory = "ivory.cli.main:run"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ivory*"]

[tool.setuptools.package-data]
ivory = ["py.typed"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
