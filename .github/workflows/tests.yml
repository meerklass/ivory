name: Unit Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0  # setuptools-scm needs tags to compute the package version

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --python ${{ matrix.python-version }} --group dev

    - name: Run tests
      run: uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short

    - name: Run console script
      run: uv run --python ${{ matrix.python-version }} ivory --help

    - name: Run smoke tests
      run: |
        bash tests/smoke/run_module_config.sh
        bash tests/smoke/run_file_path_config.sh

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run ruff check
      run: uv run ruff check

    - name: Run ruff format --check
      run: uv run ruff format --check
